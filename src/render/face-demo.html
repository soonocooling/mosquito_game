<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>부기 실얼굴 데모 (F-07)</title>
    <style>
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      #gl, #overlay { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
      #video { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
      #panel {
        position: fixed; left: 8px; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 2;
        padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.55); color: #9f9;
        font: 11px/1.5 ui-monospace, monospace; white-space: pre; pointer-events: none;
      }
      #bar {
        position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 3;
        display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 0 8px;
      }
      #bar button, #start {
        font: 14px system-ui, sans-serif; padding: 10px 14px; border: none; border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
      }
      #bar button[aria-pressed='true'] { background: #ffcc33; }
      #start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; padding: 16px 28px; background: #ffcc33; }
      #shot { position: fixed; right: 8px; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 3; width: 28vw; max-width: 180px; border: 2px solid #fff; }
    </style>
  </head>
  <body>
    <video id="video" playsinline muted autoplay></video>
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <div id="panel">시작을 누르면 카메라와 인식 모델을 불러와요</div>
    <div id="bar" hidden>
      <button id="auto" type="button" aria-pressed="false">자동 물기</button>
      <button id="dbg" type="button" aria-pressed="true">디버그</button>
      <button id="cap" type="button">캡처</button>
      <button id="reset" type="button">초기화</button>
    </div>
    <button id="start" type="button">시작</button>
    <img id="shot" alt="캡처 결과" hidden />
    <script type="module" src="./faceDemo.ts"></script>
  </body>
</html>
